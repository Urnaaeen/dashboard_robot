<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RPA Central Monitoring</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8A2.5 2.5 0 0 1 17.5 17H14l-2 3-2-3H6.5A2.5 2.5 0 0 1 4 14.5v-8Z" />
              <path d="M8 9h8M8 12h5" />
            </svg>
          </div>
          <div>
            <strong>RPA Monitoring</strong>
            <span>Central Dashboard</span>
          </div>
        </div>

        <nav class="nav-list" aria-label="Dashboard screens">
          <button class="nav-item is-active" type="button" data-view="overview">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M4 13h6V4H4v9Zm10 7h6V4h-6v16ZM4 20h6v-4H4v4Z" />
            </svg>
            <span>Overview</span>
          </button>
          <button class="nav-item" type="button" data-view="robots">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M9 7h6m-8 4h10m-9 4h8M6 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z" />
            </svg>
            <span>Robots</span>
          </button>
          <button class="nav-item" type="button" data-view="machines">
            <svg viewBox="0 0 24 24" focusable="false">
              <rect x="3" y="4" width="18" height="12" rx="2" />
              <path d="M8 20h8M12 16v4" />
            </svg>
            <span>Machines</span>
          </button>
          <button class="nav-item" type="button" data-view="history">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M3 12a9 9 0 1 0 3-6.7L3 8" />
              <path d="M3 3v5h5M12 7v5l3 2" />
            </svg>
            <span>History</span>
          </button>
        </nav>

        <div class="sidebar-footer">
          <div class="connection">
            <span class="connection-dot" id="apiDot"></span>
            <span id="apiStatus">Connecting</span>
          </div>
          <button class="icon-button" type="button" data-action="refresh" title="Refresh dashboard" aria-label="Refresh dashboard">
            <svg viewBox="0 0 24 24" focusable="false">
              <path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v6h-6" />
            </svg>
          </button>
        </div>
      </aside>

      <main class="content">
        <header class="topbar">
          <div>
            <p class="eyebrow">Dashboard phase</p>
            <h1 id="pageTitle">RPA Monitoring</h1>
            <p id="pageSubtitle">Latest robot run status from PostgreSQL.</p>
          </div>
          <div class="topbar-actions">
            <span class="timestamp" id="lastUpdated">Not loaded</span>
            <div class="account-summary" aria-label="Signed in user">
              <span class="account-avatar" id="accountAvatar" aria-hidden="true">U</span>
              <span class="account-copy">
                <strong id="accountName">User</strong>
                <span id="accountRole">VIEWER</span>
              </span>
            </div>
            <button
              class="icon-button"
              type="button"
              data-action="logout"
              title="Sign out"
              aria-label="Sign out"
            >
              <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
                <path d="M10 17l5-5-5-5M15 12H3" />
                <path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4" />
              </svg>
            </button>
          </div>
        </header>

        <section id="app" class="view-root" aria-live="polite"></section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="/app.js" defer></script>
  </body>
</html>
