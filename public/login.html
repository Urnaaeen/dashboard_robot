<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Sign in to RPA Central Monitoring" />
    <title>Sign In - RPA Central Monitoring</title>
    <link rel="stylesheet" href="login.css" />
  </head>
  <body>
    <main class="login-shell">
      <section class="login-brand" aria-label="RPA Central Monitoring">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" focusable="false">
            <path d="M4 6.5A2.5 2.5 0 0 1 6.5 4h11A2.5 2.5 0 0 1 20 6.5v8A2.5 2.5 0 0 1 17.5 17H14l-2 3-2-3H6.5A2.5 2.5 0 0 1 4 14.5v-8Z" />
            <path d="M8 9h8M8 12h5" />
          </svg>
        </div>
        <div>
          <strong>RPA Monitoring</strong>
          <span>Central Dashboard</span>
        </div>
      </section>

      <section class="login-panel" aria-labelledby="loginTitle">
        <header>
          <p class="eyebrow">Secure access</p>
          <h1 id="loginTitle">Sign in</h1>
          <p>Use the account provided by your administrator.</p>
        </header>

        <form id="loginForm">
          <div class="field">
            <label for="username">Username</label>
            <input
              id="username"
              name="username"
              type="text"
              autocomplete="username"
              autocapitalize="none"
              maxlength="100"
              required
              autofocus
            />
          </div>
          <div class="field">
            <label for="password">Password</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              maxlength="256"
              required
            />
          </div>
          <p class="form-error" id="loginError" role="alert" aria-live="polite"></p>
          <button class="submit-button" type="submit">
            <svg viewBox="0 0 24 24" focusable="false" aria-hidden="true">
              <path d="M10 17l5-5-5-5M15 12H3" />
              <path d="M14 4h4a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-4" />
            </svg>
            <span>Sign in</span>
          </button>
        </form>
      </section>
    </main>
    <script src="login.js" defer></script>
  </body>
</html>
